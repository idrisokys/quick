name: QuickShare
options:
  bundleIdPrefix: io.github.idrisokys
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  QuickShare:
    type: application
    platform: macOS
    sources: [QuickShare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.idrisokys.quickshare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShareExt
        embed: true
    info:
      path: QuickShare/Info.plist
      properties:
        CFBundleDisplayName: QuickShare
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSLocalNetworkUsageDescription: Needed to find nearby devices and share files.
        NSBonjourServices:
          - _qshare._tcp
        CFBundleURLTypes:
          - CFBundleURLName: io.github.idrisokys.quickshare
            CFBundleURLSchemes:
              - quickshare
        NSServices:
          - NSMenuItem:
              default: Send with QuickShare
            NSMessage: sendFiles
            NSPortName: QuickShare
            NSSendFileTypes:
              - public.item
  ShareExt:
    type: app-extension
    platform: macOS
    sources: [ShareExt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.idrisokys.quickshare.ShareExt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: ShareExt/ShareExt.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: ShareExt/Info.plist
      properties:
        CFBundleDisplayName: QuickShare
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
